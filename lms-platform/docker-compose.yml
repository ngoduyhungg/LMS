# =============================================================================
# LMS Platform — Docker Compose Infrastructure
# Stack: PostgreSQL 16 · Keycloak 26.2.0 · Jaeger · Prometheus · Grafana
#
# QUICK START:
#   1. git update-index --chmod=+x docker/postgres/init-multiple-dbs.sh
#   2. docker compose build keycloak
#   3. docker compose up -d
#   4. docker compose logs -f keycloak   (wait for "Keycloak ... started")
# =============================================================================

services:

  # ============================================================
  # POSTGRESQL 16
  # One instance, multiple logical databases (microservice isolation).
  # init-multiple-dbs.sh creates: keycloak_db | course_db | enrollment_db | notification_db
  # Host port 5433 → container port 5432 (avoids conflict with local PostgreSQL).
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: keycloak_db,course_db,enrollment_db,notification_db,user_db
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
      # Prefix "10-" ensures this script runs before any other init scripts.
      # The script MUST have execute permission — see init-multiple-dbs.sh header.
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/10-init-multiple-dbs.sh:ro
    ports:
      - "5433:5432"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================
  # KAFKA — Event Streaming
  # Host applications:      localhost:9092
  # Docker containers:      kafka:29092
  # ============================================================
  kafka:
    image: apache/kafka:4.1.1
    container_name: lms-kafka
    restart: unless-stopped

    environment:
      # KRaft mode — no ZooKeeper required
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single-node KRaft cluster
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Required for single broker development
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Convenient for local development
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"

    volumes:
      - lms_kafka_data:/var/lib/kafka/data

    networks:
      - lms-network

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ============================================================
  # JAEGER — All-in-one distributed tracing backend
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: lms-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "10000"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # KEYCLOAK 26.2.0 — Identity & Access Management
  # ============================================================
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    image: lms-keycloak:26.2.0
    container_name: lms-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --features-disabled=organization

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: "http://jaeger:4317"
      KC_TELEMETRY_SERVICE_NAME: "keycloak"

    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro

    ports:
      - "8180:8080"

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy

    networks:
      - lms-network

  # ============================================================
  # PROMETHEUS — Metrics scraper
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lms-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lms_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lms-network
    depends_on:
      - jaeger

  # ============================================================
  # GRAFANA — Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:11.3.1
    container_name: lms-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - lms_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - lms-network

  # ============================================================
  # MINIO — S3-Compatible Object Storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms_minio_data:/data
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-createbucket:
    image: minio/mc:latest
    container_name: lms-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lms-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/lms-certificates --ignore-existing;
      /usr/bin/mc anonymous set download myminio/lms-certificates;
      exit 0;
      "

  # ============================================================
  # JAVA MICROSERVICES (PHASE G4)
  # ============================================================

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    container_name: lms-course-service
    restart: unless-stopped
    # KHÔNG expose port ra host, chỉ chạy nội bộ
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/course_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # JWK lấy từ internal DNS
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/lms-realm/protocol/openid-connect/certs
      # Issuer URI BẮT BUỘC giữ localhost:8180 để khớp với token Frontend gửi lên
      - KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/lms-realm
      - OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: lms-user-service
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/user_db
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/lms-realm/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/lms-realm
      - OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
    container_name: lms-enrollment-service
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/enrollment_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/lms-realm/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/lms-realm
      - COURSE_SERVICE_URL=http://course-service:8081
      - USER_SERVICE_URL=http://user-service:8083
      - S3_ENDPOINT=http://minio:9000
      - OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
      course-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: lms-api-gateway
    restart: unless-stopped
    # CHỈ Expose port 8080 của Gateway ra Host để Frontend kết nối
    ports:
      - "8080:8080"
    environment:
      - COURSE_SERVICE_URL=http://course-service:8081
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8082
      - USER_SERVICE_URL=http://user-service:8083
    depends_on:
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# ============================================================
# VOLUMES
# ============================================================
volumes:
  lms_postgres_data:
    driver: local
  lms_kafka_data:
    driver: local
  lms_prometheus_data:
    driver: local
  lms_grafana_data:
    driver: local
  lms_minio_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  lms-network:
    name: lms-platform-network
    driver: bridge