server:
  port: 8082

spring:
  application:
    name: enrollment-service

  # ── Database: enrollment_db (isolated per service) ─────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/enrollment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.use_sql_comments]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # ── Kafka ───────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
  # ── Security: Keycloak as OAuth2 Resource Server ───────────────
  # Enrollment Service does NOT generate tokens — it only VALIDATES them
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/lms-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/lms-realm

# ── Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      timeout: 5s
    metrics:
      export:
        step: 10s

# ── OpenTelemetry Resource Attributes ─────────────────────────────
otel:
  service:
    name: ${spring.application.name}

  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf

  propagators: tracecontext,baggage

  instrumentation:
    spring-web:
      enabled: true
    spring-webmvc:
      enabled: true
    jdbc:
      enabled: true

# ── Logging with Trace IDs injected automatically ─────────────────
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

  level:
    "[org.springframework.security]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[com.lms]": DEBUG
# ── Object Storage (S3 / MinIO) ───────────────────────────────────
app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:lms-certificates}
      # path-style-access: Bắt buộc = true cho MinIO local để dùng URL dạng http://localhost:9000/bucket/...
      # Nếu = false, SDK sẽ cố trỏ tới http://bucket.localhost:9000/... (cần DNS server).
      # Khi lên Production AWS S3 có thể set false.
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}